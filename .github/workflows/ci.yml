name: ci

on:
  push:
    branches: [main, staging, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The documentation under content/docs/ is generated from the
      # application repository at the ref hugo.toml selects. Checking it out
      # here lets the drift check re-run the sync and compare.
      - name: Check out the application repository
        uses: actions/checkout@v4
        with:
          repository: sidescopes/sidescopes
          path: .sidescopes-code
          fetch-depth: 0

      - name: Documentation is current
        env:
          SIDESCOPES_CODE_REPO: ${{ github.workspace }}/.sidescopes-code
        run: scripts/sync-docs.sh --check

      - uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build
        run: hugo --gc --minify --printPathWarnings --cleanDestinationDir

      # A page that references a screenshot nobody generated would ship a
      # hole. Outside development that is an error, so prove the switch that
      # downgrades it is not left on.
      - name: No missing figures
        run: |
          if grep -q '^  allowMissingFigures = true' hugo.toml; then
            echo "::error::allowMissingFigures is still set in hugo.toml."
            echo "Remove it once the screenshots are published; while it is"
            echo "set, a page missing its figure builds green with a gap."
            exit 1
          fi

      # Two flags carry this, and without them the step cannot pass at all.
      #
      # --root-dir is what makes a root-relative link checkable: without it
      # lychee reads public/ as loose files with no site around them, and every
      # /learn/, /docs/ and /favicon.ico in the build is unresolvable. It was
      # failing on 1039 of those - the whole site, rather than anything broken
      # - which is also why the two genuinely dead links in the footer sat
      # there unnoticed. A check that cries wolf about everything reports
      # nothing.
      #
      # --index-files is what lets a DIRECTORY link carry a fragment. Every
      # internal link here ends in a slash, as Hugo writes them, so without it
      # /download/#verify resolves to a directory and no anchor can be found
      # inside it - and fragment checking, which is the reason for
      # --include-fragments, silently applies to nothing but stylesheets.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --include-fragments
            --root-dir "$GITHUB_WORKSPACE/public"
            --index-files index.html
            --exclude '^https://sidescopes\.org'
            --exclude '^https://media\.sidescopes\.org'
            --exclude '^https://helpx\.adobe\.com'
            --exclude '^https://github\.com/sidescopes/sidescopes/releases'
            public
          fail: true
