name: release-data

# Keeps data/release.json in step with the latest published release, so the
# version on the download page and in the structured data is never a number
# somebody remembered to update.
#
# It pushes to MAIN, and main is not what deploys: production builds from
# `release`, which is fast-forwarded deliberately. So a new release updates
# the number here immediately and reaches the live site at the next publish.
# That is the intended trade - the alternative is a scheduled job pushing
# whatever else happens to be on main to production at 06:17.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view --repo sidescopes/sidescopes --json tagName,publishedAt,url,assets \
            > /tmp/release.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/release.json', 'utf8'));
          const tag = r.tagName || '';
          if (!/^v\d+\.\d+\.\d+/.test(tag)) {
            throw new Error(`unexpected tag ${tag}`);
          }
          function platformAsset(platform) {
            const name = `SideScopes-${tag}-${platform}.zip`;
            const archive = r.assets.find((asset) => asset.name === name);
            const checksum = r.assets.find((asset) => asset.name === `${name}.sha256`);
            if (!archive || !checksum || !archive.digest?.startsWith('sha256:')) {
              throw new Error(`release is missing the ${platform} archive, digest, or checksum file`);
            }
            return {
              name,
              url: archive.url,
              sha256: archive.digest.slice('sha256:'.length),
              sha256URL: checksum.url,
            };
          }
          const out = {
            _comment: 'Written by .github/workflows/release-data.yml. Do not edit by hand.',
            version: tag.replace(/^v/, ''),
            tag,
            published: (r.publishedAt || '').slice(0, 10),
            url: r.url,
            assets: {
              macos: platformAsset('macos'),
              windows: platformAsset('windows'),
            },
          };
          fs.writeFileSync('data/release.json', JSON.stringify(out, null, 2) + '\n');
          NODE

      - name: Commit if it moved
        run: |
          set -euo pipefail
          if git diff --quiet -- data/release.json; then
            echo "release data unchanged"
            exit 0
          fi
          version=$(node -e "process.stdout.write(require('./data/release.json').version)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/release.json
          git commit -m "chore: record release ${version}"
          git push
